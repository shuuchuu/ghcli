[project]
authors = [
  {name = "m09", email = "142691+m09@users.noreply.github.com"},
]
dependencies = [
  "gradio >= 6, < 7",
  "niquests >= 3.21, < 4",
]
description = "CLI to list and create GitHub issues."
homepage = "https://github.com/shuuchuu/ghcli"
license = "Apache-2.0"
license-files = ["LICENSE"]
name = "ghcli"
readme = "README.md"
requires-python = ">= 3.13"
version = "0.1.0"

[dependency-groups]
dev = [
  "doit >= 0.37",
  "pytest >= 9",
  "ruff >= 0.17",
  "ty >= 0.0.88",
]

[project.scripts]
ghcli = "ghcli.cli:main"

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
ignore = [
  "D1",
  "incorrect-blank-line-before-class",
  "multi-line-summary-second-line",
  "non-empty-init-module",
]
preview = true
select = ["A", "B", "C", "D", "DOC", "E", "EM", "F", "I", "N", "PIE", "PTH", "RET", "RUF", "SIM", "SLF", "TC", "UP", "W"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.uv.build-backend]
# Published as ghcli-<GitHub user>, imported as ghcli.
module-name = "ghcli"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.13.1,<0.14.0"]
